name: Verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.99.0
      - run: cargo fetch --locked
      - run: cargo fmt --check
      - run: cargo clippy --offline --locked --all-targets -- -D warnings
      - run: cargo test --offline --locked
      - run: cargo build --offline --locked
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          enable_kvm: false
      - run: nix build path:.
      - run: test "$(./result/bin/drift --version)" = "drift 0.1.0"
      - run: ./result/bin/drift --help
